# Roll an environment back to an earlier Worker version (code and config; D1 is not rolled back, so migrations must
# stay compatible with the previous release). Leave version_id empty for the version before the current one.
# Find ids and their release tags with: npx wrangler deployments list [--env staging]
name: rollback
on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to roll back
        type: choice
        options: [production, staging]
        required: true
      version_id:
        description: Worker version id to roll back to (empty = the previous version)
        required: false
        default: ""
      reason:
        description: Why (recorded on the deployment)
        required: true

permissions:
  contents: read

concurrency:
  group: rollback-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll back ${{ inputs.target }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET: ${{ inputs.target }}
      VERSION_ID: ${{ inputs.version_id }}
      REASON: ${{ inputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false   # no cache in jobs that deploy (cache poisoning)
      - run: npm ci
      - name: Roll back
        run: |
          env_args=()
          [ "$TARGET" = "staging" ] && env_args=(--env staging)
          version_args=()
          [ -n "$VERSION_ID" ] && version_args=("$VERSION_ID")
          npx wrangler rollback "${version_args[@]}" "${env_args[@]}" --message "rollback by $GITHUB_ACTOR: $REASON" --yes
          npx wrangler deployments list "${env_args[@]}" | head -40
